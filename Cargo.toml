[package]
name = "containrs"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.31.1", features = [
  "sched",
  "mount",
  "hostname",
  "process",
  "fs",
  "user",
  "term",
  "signal",
] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
xz2 = "0.1.7"
tar = "0.4.46"
flate2 = "1.1.9"
reqwest = { version = "0.13.4", features = ["blocking", "rustls"] }

